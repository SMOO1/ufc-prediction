<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="UFSEE predicts UFC matchups and the next UFC fight card.">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'">
    <title>UFSEE — Predict a fight</title>
    <link rel="stylesheet" href="/styles.css?v=5">
    <script src="/app.js?v=4" defer></script>
</head>
<body>
<header class="site-header">
    <a class="brand" href="/" aria-label="UFSEE home">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>UF<span>SEE</span></span>
    </a>
</header>

<main>
    <div class="content-grid">
      <div class="primary-column">
        <section class="hero">
            <p class="eyebrow">UFSEE MODEL</p>
            <h1>Predict a fight</h1>
        </section>

        <section class="prediction-shell" aria-label="Choose fighters">
        <form id="predictionForm" novalidate>
            <div class="fighters-grid">
                <label class="fighter-input">
                    <span>Fighter 1</span>
                    <input id="fighter1" name="fighter1" type="text" autocomplete="off" maxlength="100"
                           placeholder="Sean O'Malley" required>
                </label>

                <span class="versus" aria-hidden="true">vs</span>

                <label class="fighter-input">
                    <span>Fighter 2</span>
                    <input id="fighter2" name="fighter2" type="text" autocomplete="off" maxlength="100"
                           placeholder="Merab Dvalishvili" required>
                </label>
            </div>

            <div id="errorMessage" class="error-message" role="alert" hidden></div>

            <button id="submitButton" class="predict-button" type="submit">
                <span class="button-label">Predict winner</span>
                <span class="button-loading" hidden>Predicting...</span>
            </button>
        </form>
        </section>

        <section id="results" class="results" aria-live="polite" hidden>
        <h2>Prediction</h2>

        <div class="probability-card">
            <div class="probability-side">
                <h3 id="redResultName"></h3>
                <strong id="redProbability">0%</strong>
            </div>
            <div class="probability-center">
                <p>Winner</p>
                <strong id="winnerName"></strong>
                <small id="confidenceLabel"></small>
            </div>
            <div class="probability-side">
                <h3 id="blueResultName"></h3>
                <strong id="blueProbability">0%</strong>
            </div>
        </div>

        <div id="profileCards" class="profile-grid"></div>
        </section>
      </div>

      <aside class="upcoming-panel" aria-labelledby="upcomingHeading">
        <header class="upcoming-header">
          <p>Next card</p>
          <h2 id="upcomingHeading">Upcoming predictions</h2>
        </header>
        <div id="upcomingStatus" class="upcoming-status">Loading upcoming card...</div>
        <div id="upcomingEvent" hidden>
          <a id="upcomingEventName" class="event-name" target="_blank" rel="noreferrer"></a>
          <p id="upcomingEventMeta" class="event-meta"></p>
          <div id="upcomingBouts" class="upcoming-bouts"></div>
        </div>
      </aside>
    </div>
</main>
</body>
</html>
